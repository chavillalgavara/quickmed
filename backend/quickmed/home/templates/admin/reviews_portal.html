<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickMed - Reviews Backend Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
            text-align: center;
        }
        
        .header h1 {
            color: #7C2A62;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }
        
        .stat-card h3 {
            color: #7C2A62;
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .stat-card p {
            color: #666;
            font-size: 1em;
        }
        
        .actions {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            margin-bottom: 30px;
        }
        
        .actions h2 {
            color: #7C2A62;
            margin-bottom: 20px;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background: #7C2A62;
            color: white;
        }
        
        .btn-primary:hover {
            background: #5a1a4a;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(124, 42, 98, 0.3);
        }
        
        .btn-secondary {
            background: #667eea;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        
        .btn-success {
            background: #4CAF50;
            color: white;
        }
        
        .btn-success:hover {
            background: #45a049;
            transform: translateY(-2px);
        }
        
        .reviews-list {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .reviews-list h2 {
            color: #7C2A62;
            margin-bottom: 20px;
        }
        
        .review-item {
            padding: 20px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .review-item:last-child {
            border-bottom: none;
        }
        
        .review-info h4 {
            color: #333;
            margin-bottom: 5px;
        }
        
        .review-info p {
            color: #666;
            font-size: 0.9em;
        }
        
        .review-rating {
            color: #FFD700;
            font-size: 1.2em;
        }
        
        .status-badge {
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }
        
        .status-approved {
            background: #d4edda;
            color: #155724;
        }
        
        .status-pending {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-rejected {
            background: #f8d7da;
            color: #721c24;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏥 QuickMed Backend Portal</h1>
            <p>Reviews Management System</p>
        </div>
        
        <div class="stats" id="stats">
            <div class="stat-card">
                <h3 id="total-reviews">-</h3>
                <p>Total Reviews</p>
            </div>
            <div class="stat-card">
                <h3 id="approved-reviews">-</h3>
                <p>Approved</p>
            </div>
            <div class="stat-card">
                <h3 id="pending-reviews">-</h3>
                <p>Pending</p>
            </div>
            <div class="stat-card">
                <h3 id="avg-rating">-</h3>
                <p>Average Rating</p>
            </div>
        </div>
        
        <div class="actions">
            <h2>Quick Actions</h2>
            <div class="btn-group">
                <a href="/admin/" class="btn btn-primary">Django Admin Panel</a>
                <a href="/api/reviews/" class="btn btn-secondary">View API Endpoint</a>
                <a href="/api/reviews/?format=json" class="btn btn-success">View JSON Data</a>
                <button onclick="refreshData()" class="btn btn-primary">🔄 Refresh Data</button>
            </div>
        </div>
        
        <div class="reviews-list">
            <h2>Recent Reviews</h2>
            <div id="reviews-container">
                <div class="loading">Loading reviews...</div>
            </div>
        </div>
    </div>
    
    <script>
        const API_BASE_URL = window.location.origin;
        
        async function fetchReviews() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/reviews/?status=`);
                if (!response.ok) throw new Error('Failed to fetch reviews');
                const data = await response.json();
                return Array.isArray(data) ? data : (data.results || []);
            } catch (error) {
                console.error('Error:', error);
                return [];
            }
        }
        
        function calculateStats(reviews) {
            const total = reviews.length;
            const approved = reviews.filter(r => r.status === 'approved').length;
            const pending = reviews.filter(r => r.status === 'pending').length;
            const avgRating = reviews.length > 0 
                ? (reviews.reduce((sum, r) => sum + r.rating, 0) / reviews.length).toFixed(1)
                : '0.0';
            
            document.getElementById('total-reviews').textContent = total;
            document.getElementById('approved-reviews').textContent = approved;
            document.getElementById('pending-reviews').textContent = pending;
            document.getElementById('avg-rating').textContent = avgRating;
        }
        
        function renderReviews(reviews) {
            const container = document.getElementById('reviews-container');
            
            if (reviews.length === 0) {
                container.innerHTML = '<div class="loading">No reviews found. Create one from the frontend!</div>';
                return;
            }
            
            container.innerHTML = reviews.slice(0, 10).map(review => `
                <div class="review-item">
                    <div class="review-info">
                        <h4>${review.name} (${review.email})</h4>
                        <p>${review.comment.substring(0, 100)}${review.comment.length > 100 ? '...' : ''}</p>
                        <small>${new Date(review.created_at).toLocaleString()}</small>
                    </div>
                    <div style="text-align: right;">
                        <div class="review-rating">${'⭐'.repeat(review.rating)}</div>
                        <span class="status-badge status-${review.status}">${review.status}</span>
                    </div>
                </div>
            `).join('');
        }
        
        async function loadData() {
            const reviews = await fetchReviews();
            calculateStats(reviews);
            renderReviews(reviews);
        }
        
        function refreshData() {
            document.getElementById('reviews-container').innerHTML = '<div class="loading">Refreshing...</div>';
            loadData();
        }
        
        // Load data on page load
        loadData();
        
        // Auto-refresh every 30 seconds
        setInterval(loadData, 30000);
    </script>
</body>
</html>
